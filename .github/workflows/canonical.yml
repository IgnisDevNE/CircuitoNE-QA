name: Canonical acceptance

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed CircuitoNE CI run ID
        required: true
        type: string
      mode:
        description: Validate PR or promote merged tests
        required: true
        type: choice
        options: [accept, promote]

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      mode: ${{ steps.source.outputs.mode }}
      sourceSha: ${{ steps.source.outputs.sourceSha }}
      sourceMainSha: ${{ steps.source.outputs.sourceMainSha }}
      sourcePr: ${{ steps.source.outputs.sourcePr }}
      runId: ${{ steps.source.outputs.runId }}
      acceptedSha: ${{ steps.accepted.outputs.sha }}
      suiteSha: ${{ steps.proposal.outputs.suiteSha }}
      proposalPr: ${{ steps.proposal.outputs.proposalPr }}
      alreadyPromoted: ${{ steps.proposal.outputs.alreadyPromoted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: accepted
          path: accepted
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Resolve trusted source event
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node runner/scripts/resolve.mjs '${{ inputs.source_run_id }}' '${{ inputs.mode }}'
      - name: Pin accepted suite
        id: accepted
        run: echo "sha=$(git -C accepted rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.mode == 'accept' }}
        with:
          repository: IgnisDevNE/CircuitoNE
          ref: ${{ steps.source.outputs.sourceSha }}
          path: candidate
          persist-credentials: false
      - name: Stage changed tests as a QA proposal
        if: ${{ inputs.mode == 'accept' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node runner/scripts/stage.mjs accepted '${{ steps.accepted.outputs.sha }}' candidate '${{ steps.source.outputs.sourceSha }}' '${{ steps.source.outputs.sourcePr }}'
      - name: Resolve reviewed test proposal
        id: proposal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node runner/scripts/proposal.mjs '${{ steps.source.outputs.sourcePr }}' '${{ steps.source.outputs.sourceMainSha }}' '${{ steps.accepted.outputs.sha }}' accepted '${{ inputs.mode }}' '${{ steps.source.outputs.sourceSha }}'

  test:
    if: ${{ needs.resolve.outputs.alreadyPromoted != 'true' }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.suiteSha }}
          path: runner/.qa-suite
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IgnisDevNE/CircuitoNE
          ref: ${{ needs.resolve.outputs.sourceSha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: pnpm
          cache-dependency-path: runner/pnpm-lock.yaml
      - name: Verify candidate test tree and proposal scope
        run: node runner/scripts/integrity.mjs candidate '${{ needs.resolve.outputs.sourceSha }}' runner/.qa-suite '${{ needs.resolve.outputs.suiteSha }}' '${{ needs.resolve.outputs.acceptedSha }}' '${{ needs.resolve.outputs.sourceMainSha }}'
      - name: Install trusted runner
        working-directory: runner
        run: pnpm install --frozen-lockfile
      - name: Install browser
        working-directory: runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Build candidate without QA credentials
        run: docker build --tag circuitone-candidate candidate
      - name: Start isolated candidate container
        run: |
          docker run --detach --name circuitone-candidate --read-only --cap-drop ALL --security-opt no-new-privileges --memory 128m -p 127.0.0.1:5182:8080 circuitone-candidate
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5182/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Execute approved browser suite
        working-directory: runner
        env:
          QA_TEST_DIR: .qa-suite/tests/e2e
        run: pnpm test > "$RUNNER_TEMP/canonical-results.json"
      - name: Reject missing or skipped tests
        run: node runner/scripts/results.mjs "$RUNNER_TEMP/canonical-results.json"

  publish:
    if: ${{ always() && inputs.mode == 'accept' && needs.resolve.result == 'success' }}
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    environment: QA Publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Publish check from separate QA App
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_APP_ID: ${{ secrets.QA_APP_ID }}
          QA_APP_INSTALLATION_ID: ${{ secrets.QA_APP_INSTALLATION_ID }}
          QA_APP_PRIVATE_KEY: ${{ secrets.QA_APP_PRIVATE_KEY }}
          QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node runner/scripts/publish.mjs '${{ needs.resolve.outputs.runId }}' '${{ needs.resolve.outputs.sourceSha }}' '${{ needs.resolve.outputs.sourceMainSha }}' '${{ needs.resolve.outputs.sourcePr }}' '${{ needs.resolve.outputs.suiteSha }}' '${{ needs.resolve.outputs.acceptedSha }}' '${{ needs.test.result }}'

  promote:
    if: ${{ inputs.mode == 'promote' && needs.test.result == 'success' }}
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    environment: QA Publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: accepted
          path: accepted
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Promote exactly the tested suite after merged PR verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_APP_ID: ${{ secrets.QA_APP_ID }}
        run: node runner/scripts/promote.mjs accepted '${{ needs.resolve.outputs.acceptedSha }}' '${{ needs.resolve.outputs.suiteSha }}' '${{ needs.resolve.outputs.sourceSha }}' '${{ needs.resolve.outputs.sourceMainSha }}' '${{ needs.resolve.outputs.sourcePr }}' '${{ needs.resolve.outputs.runId }}'
